<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Foreldrekontroll</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">🎮</span>
          <h1>Roblox Foreldrekontroll</h1>
        </div>
        <div class="status-bar">
          <span id="presence-badge" class="badge badge-offline">Offline</span>
          <span id="last-updated" class="last-updated"></span>
        </div>
      </div>
    </header>

    <div id="auth-error-banner" class="auth-error-banner hidden">
      ⚠️ Cookie er utløpt eller ugyldig. Oppdater <strong>roblosecurity_cookie</strong> i addon-innstillingene.
    </div>

    <main>
      <!-- Aktiv økt -->
      <section id="current-game-section" class="card hidden">
        <h2>Spiller nå</h2>
        <div class="current-game">
          <div class="game-icon">🕹️</div>
          <div class="game-info">
            <div id="current-game-name" class="game-name-large"></div>
            <div id="current-game-status" class="game-status-tag"></div>
          </div>
          <div class="game-actions" id="current-game-actions"></div>
        </div>
      </section>

      <!-- Skjermtid -->
      <section class="card">
        <h2>Skjermtid</h2>
        <div class="screentime-grid">
          <div class="screentime-box">
            <div class="screentime-value" id="today-value">—</div>
            <div class="screentime-label">I dag</div>
            <div class="screentime-limit" id="today-limit"></div>
          </div>
          <div class="screentime-box">
            <div class="screentime-value" id="week-value">—</div>
            <div class="screentime-label">Denne uken</div>
          </div>
        </div>
        <div class="week-chart" id="week-chart"></div>
      </section>

      <!-- Faner: Alle spill / Godkjente / Blokkerte -->
      <section class="card">
        <h2>Spill denne uken</h2>
        <div class="tabs">
          <button class="tab active" data-tab="all">Alle</button>
          <button class="tab" data-tab="approved">Godkjente</button>
          <button class="tab" data-tab="blocked">Blokkerte</button>
          <button class="tab" data-tab="unknown">Ukjente</button>
        </div>
        <div id="games-list" class="games-list"></div>
        <div id="games-empty" class="empty-state hidden">Ingen spill i denne kategorien</div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
