name: "Roblox Foreldrekontroll"
description: "Overvåk barnets Roblox-bruk: skjermtid, spillhistorikk og godkjenning/blokkering av spill"
version: "1.0.4"
slug: "roblox_parental"
url: "https://github.com/nullnalen/homeassistant-addons"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
ingress: true
ingress_port: 8099
panel_icon: "mdi:gamepad-variant"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Roblox foreldrekontroll webgrensesnitt"
options:
  slow_poll_interval: 30
  fast_poll_interval: 2
  presence_enabled: true
  ha_token: ""
schema:
  slow_poll_interval: "int"
  fast_poll_interval: "int"
  presence_enabled: "bool"
  ha_token: "str?"
